name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Instalar componentes Android
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Instalar dependencias Node
        run: npm install

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Agregar permisos en AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "RECORD_AUDIO" $MANIFEST || sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application|' $MANIFEST
          grep -q "MODIFY_AUDIO_SETTINGS" $MANIFEST || sed -i 's|<application|<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <application|' $MANIFEST
          grep -q "WRITE_EXTERNAL_STORAGE" $MANIFEST || sed -i 's|<application|<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <application|' $MANIFEST

      - name: Registrar el widget de carga por voz en el Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "QuickVoiceWidgetProvider" $MANIFEST || sed -i 's|</application>|    <receiver android:name=".QuickVoiceWidgetProvider" android:exported="false">\n            <intent-filter>\n                <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>\n            </intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/quick_voice_widget_info"/>\n        </receiver>\n    </application>|' $MANIFEST

      - name: Instalar puente nativo de Descargas
        run: |
          cp native/downloads/MainActivity.java android/app/src/main/java/com/ciro/flyfinanzas/MainActivity.java
          cp native/downloads/DownloadsPlugin.java android/app/src/main/java/com/ciro/flyfinanzas/DownloadsPlugin.java

      - name: Instalar widget de carga por voz
        run: |
          cp native/widget/QuickVoiceWidgetProvider.java android/app/src/main/java/com/ciro/flyfinanzas/QuickVoiceWidgetProvider.java
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/xml android/app/src/main/res/drawable
          cp native/widget/widget_quick_voice.xml android/app/src/main/res/layout/widget_quick_voice.xml
          cp native/widget/quick_voice_widget_info.xml android/app/src/main/res/xml/quick_voice_widget_info.xml
          cp native/widget/bg_widget_circle.xml android/app/src/main/res/drawable/bg_widget_circle.xml
          cp native/widget/ic_widget_mic.xml android/app/src/main/res/drawable/ic_widget_mic.xml
          cp native/widget/ic_widget_mic_dark.xml android/app/src/main/res/drawable/ic_widget_mic_dark.xml
          cp native/widget/ic_widget_mic_pixel.xml android/app/src/main/res/drawable/ic_widget_mic_pixel.xml
          for t in claro oscuro win matrix neo blob mosca; do
            cp native/widget/bg_widget_$t.xml android/app/src/main/res/drawable/bg_widget_$t.xml
          done

      - name: Instalar ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Copiar ícono de la app (launcher)
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dir
          done
          convert Logo-App.jpg -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert Logo-App.jpg -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert Logo-App.jpg -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert Logo-App.jpg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert Logo-App.jpg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Copiar ícono de notificación
        run: |
          mkdir -p android/app/src/main/res/drawable
          convert www/assets/ic_notification.png -fuzz 5% -transparent white -fill white -opaque black android/app/src/main/res/drawable/ic_notification.png

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: El archivo APK no existe en $APK_PATH"
            exit 1
          fi

          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          SIZE_MB=$(echo "scale=1; $SIZE_BYTES / 1048576" | bc)
          echo "Tamaño del APK: ${SIZE_MB} MB ($SIZE_BYTES bytes)"

          if [ "$SIZE_BYTES" -lt 2000000 ]; then
            echo "ERROR: El APK es demasiado pequeño (${SIZE_MB} MB). El build está incompleto."
            exit 1
          fi

          echo "=== Información del APK ==="
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging "$APK_PATH" | head -10

          echo "=== Firmado del APK ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK_PATH" || echo "Advertencia: no se pudo verificar la firma"

          echo "APK_SIZE_MB=${SIZE_MB}" >> $GITHUB_ENV
          echo "APK_SIZE_BYTES=${SIZE_BYTES}" >> $GITHUB_ENV

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Flyfinanzas.apk

      - name: Publicar como GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Última versión"
          body: |
            APK generado automáticamente desde la rama main.

            **Tamaño:** ${{ env.APK_SIZE_MB }} MB
            **Requiere:** Android 5.1 o superior (API 22+)
            **Tipo:** Debug (no requiere Play Store)

            ⚠️ Antes de instalar: activá "Fuentes desconocidas" en Ajustes → Seguridad
          files: Flyfinanzas.apk
          make_latest: true
